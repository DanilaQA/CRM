name: SberCRM Login Tests CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    name: Run Selenium login tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with Allure
        env:
          HEADLESS: 'true'
          SBERCRM_BASE_URL: ${{ secrets.SBERCRM_BASE_URL }}
        run: |
          python -m pytest tests/ -q --alluredir=allure-results

      - name: Upload test report (Allure results)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
          retention-days: 14

      - name: Get Allure history
        if: always()
        continue-on-error: true
        run: |
          git clone --depth=1 --branch gh-pages https://github.com/${{ github.repository }}.git gh-pages || echo "gh-pages branch not found, starting fresh"

      - name: Install Allure CLI
        if: always()
        run: |
          pip install allure-commandline

      - name: Build Allure report
        if: always()
        run: |
          # Копируем историю из предыдущего прогона (если есть)
          if [ -d "gh-pages/history" ]; then
            mkdir -p allure-results/history
            cp -r gh-pages/history/* allure-results/history/ || true
          fi
          allure generate allure-results -o allure-report --clean

      - name: Publish Allure report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
          keep_files: true
